
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Examen - Civilización Romana</title>
<style>
:root {
  --azul:#17365d;
  --claro:#edf3fa;
  --verde:#177245;
  --rojo:#b42332;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:#edf1f5;
  color:#202b38;
  font-family:Arial, sans-serif;
}
header {
  background:var(--azul);
  color:white;
  text-align:center;
  padding:24px 15px;
}
header h1 { margin:8px 0; font-size:25px; }
header p { margin:5px; }
main { max-width:850px; margin:25px auto; padding:0 14px; }
.panel, .pregunta {
  background:white;
  border-radius:12px;
  padding:22px;
  margin-bottom:16px;
  box-shadow:0 2px 8px #00000012;
}
label { display:block; margin:10px 0; }
input[type=text] {
  width:100%;
  padding:12px;
  border:1px solid #b8c5d3;
  border-radius:7px;
  font-size:16px;
}
.pregunta h3 { font-size:17px; line-height:1.5; }
.tipo { color:#66788d; font-size:12px; font-weight:bold; }
.opcion {
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:13px;
  margin:9px 0;
  border:1px solid #d7e0ea;
  border-radius:8px;
  cursor:pointer;
  line-height:1.4;
}
.opcion:hover { background:#f2f6fb; }
.opcion:has(input:checked) {
  background:#e0ecfc;
  border-color:#376bb1;
}
.opcion input { margin-top:2px; accent-color:var(--azul); }
.correcta {
  background:#e1f6e9!important;
  border-color:var(--verde)!important;
}
.incorrecta {
  background:#fce6e8!important;
  border-color:var(--rojo)!important;
}
.explicacion {
  margin-top:12px;
  padding:12px;
  background:#f1f5f9;
  border-radius:7px;
  font-size:14px;
}
button {
  background:var(--azul);
  color:white;
  border:0;
  border-radius:8px;
  padding:14px 22px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
button:hover { opacity:.9; }
button:disabled { opacity:.5; cursor:not-allowed; }
#resultado {
  display:none;
  text-align:center;
  border-top:5px solid var(--azul);
}
.nota { font-size:46px; font-weight:bold; color:var(--azul); }
.progreso { font-weight:bold; color:var(--azul); }
.acciones { display:flex; flex-wrap:wrap; gap:10px; }
.aviso { color:var(--rojo); font-weight:bold; }
@media print {
  body { background:white; }
  header { color:black; background:white; }
  button { display:none; }
  .panel,.pregunta { box-shadow:none; border:1px solid #ccc; }
}
</style>
</head>
<body>

<header>
  <h1>IRISH INTERNATIONAL SCHOOL NUEVO LAREDO</h1>
  <h2>HISTORIA - LA CIVILIZACIÓN ROMANA</h2>
  <p>Evaluación de 30 reactivos</p>
</header>

<main>
<section class="panel">
  <label>Nombre completo del alumno</label>
  <input id="nombre" type="text" placeholder="Escribe tu nombre">
  <label>Grupo</label>
  <input id="grupo" type="text" placeholder="Escribe tu grupo">
  <p><b>Instrucciones:</b> Lee cuidadosamente cada pregunta y selecciona una sola respuesta. Cada reactivo tiene el mismo valor.</p>
  <p class="progreso" id="progreso">Respondidas: 0 de 30</p>
</section>

<div id="examen"></div>

<section class="panel">
  <p id="aviso" class="aviso"></p>
  <div class="acciones">
    <button id="entregar" onclick="calificar()">Entregar examen</button>
    <button onclick="nuevoExamen()" type="button">Reiniciar examen</button>
  </div>
</section>

<section class="panel" id="resultado">
  <h2>Resultado del examen</h2>
  <p id="alumnoResultado"></p>
  <div class="nota" id="nota"></div>
  <h3 id="aciertos"></h3>
  <p id="mensaje"></p>
  <button onclick="window.print()">Imprimir resultado</button>
</section>
</main>

<script>
"use strict";

// Cada pregunta tiene una respuesta correcta identificada
// por su texto, no por su posición.

const banco = [
{
 tipo:"OM",
 p:"¿En qué península surgió la ciudad de Roma?",
 o:["Península itálica","Península ibérica","Península balcánica","Península escandinava"],
 r:"Península itálica",
 e:"Roma surgió en la península itálica."
},
{
 tipo:"OM",
 p:"¿Qué mar dominó Roma durante su máxima expansión?",
 o:["Mar Negro","Mar Mediterráneo","Mar del Norte","Mar Báltico"],
 r:"Mar Mediterráneo",
 e:"Los romanos llamaron Mare Nostrum al Mediterráneo."
},
{
 tipo:"OM",
 p:"Según la leyenda, ¿quiénes fundaron Roma?",
 o:["César y Augusto","Trajano y Teodosio","Rómulo y Remo","Júpiter y Marte"],
 r:"Rómulo y Remo",
 e:"La tradición atribuye la fundación a Rómulo y Remo."
},
{
 tipo:"OM",
 p:"¿En qué año se sitúa la fundación legendaria de Roma?",
 o:["509 a. C.","476 d. C.","395 d. C.","753 a. C."],
 r:"753 a. C.",
 e:"La fecha tradicional es 753 a. C."
},
{
 tipo:"OM",
 p:"¿Cuál es el orden correcto de las etapas políticas de Roma?",
 o:[
 "República, Monarquía, Imperio",
 "Monarquía, República, Imperio",
 "Imperio, República, Monarquía",
 "Monarquía, Imperio, República"
 ],
 r:"Monarquía, República, Imperio",
 e:"Son las tres grandes etapas de la historia romana."
},
{
 tipo:"OM",
 p:"¿En qué año comenzó la República romana?",
 o:["27 a. C.","212 d. C.","509 a. C.","753 a. C."],
 r:"509 a. C.",
 e:"La etapa monárquica terminó en 509 a. C."
},
{
 tipo:"OM",
 p:"Durante la República, ¿quién elegía a los magistrados?",
 o:["Los emperadores","Los sacerdotes","Los esclavos","Los comicios"],
 r:"Los comicios",
 e:"Los comicios elegían magistrados y aprobaban leyes."
},
{
 tipo:"OM",
 p:"¿Cuál era una función del Senado durante la República?",
 o:[
 "Aconsejar a los magistrados",
 "Dirigir todos los templos",
 "Elegir a los esclavos",
 "Organizar las cosechas"
 ],
 r:"Aconsejar a los magistrados",
 e:"El Senado estaba formado por aristócratas y antiguos magistrados."
},
{
 tipo:"OM",
 p:"¿Quién fue el primer emperador romano?",
 o:["Julio César","Nerón","Octavio Augusto","Teodosio"],
 r:"Octavio Augusto",
 e:"Octavio Augusto fue el primer emperador."
},
{
 tipo:"OM",
 p:"¿Qué caracterizó políticamente a la etapa imperial?",
 o:[
 "El gobierno exclusivo de los comicios",
 "La concentración del poder en el emperador",
 "La desaparición de los magistrados",
 "El gobierno de los reyes etruscos"
 ],
 r:"La concentración del poder en el emperador",
 e:"El emperador concentraba el poder político."
},
{
 tipo:"OM",
 p:"¿Qué emperador dividió el Imperio en dos partes en 395 d. C.?",
 o:["Augusto","Caracalla","Trajano","Teodosio"],
 r:"Teodosio",
 e:"Teodosio dividió el Imperio en Oriente y Occidente."
},
{
 tipo:"OM",
 p:"¿En qué año terminó el Imperio romano de Occidente?",
 o:["476 d. C.","395 d. C.","212 d. C.","509 a. C."],
 r:"476 d. C.",
 e:"El Imperio romano de Occidente terminó en 476 d. C."
},
{
 tipo:"OM",
 p:"¿Cuál era la actividad económica básica durante la República?",
 o:["La minería","La agricultura","La navegación","La escultura"],
 r:"La agricultura",
 e:"La agricultura era la actividad económica básica."
},
{
 tipo:"OM",
 p:"¿Qué favoreció el crecimiento del comercio romano?",
 o:[
 "La desaparición de los puertos",
 "El cierre de las provincias",
 "La reducción de las ciudades",
 "Las calzadas y los puertos"
 ],
 r:"Las calzadas y los puertos",
 e:"Las vías terrestres y los puertos facilitaron el comercio."
},
{
 tipo:"OM",
 p:"¿Cómo se llamaban los esclavos que obtenían su libertad?",
 o:["Patricios","Magistrados","Libertos","Plebeyos"],
 r:"Libertos",
 e:"Los esclavos liberados se convertían en libertos."
},
{
 tipo:"OM",
 p:"¿Qué emperador extendió la ciudadanía romana en 212 d. C.?",
 o:["Caracalla","Augusto","Julio César","Trajano"],
 r:"Caracalla",
 e:"El edicto de Caracalla extendió la ciudadanía romana."
},
{
 tipo:"OM",
 p:"¿Qué era el foro en una ciudad romana?",
 o:[
 "Una vivienda para familias ricas",
 "Una explotación agrícola",
 "Un edificio destinado a esclavos",
 "Un espacio central con edificios públicos"
 ],
 r:"Un espacio central con edificios públicos",
 e:"En el foro se encontraban importantes edificios religiosos y civiles."
},
{
 tipo:"OM",
 p:"¿Cómo se llamaban los edificios de varios pisos donde vivían familias pobres?",
 o:["Domus","Ínsulas","Termas","Villas"],
 r:"Ínsulas",
 e:"Las ínsulas eran viviendas de varios pisos."
},
{
 tipo:"OM",
 p:"¿Qué construcción romana transportaba agua?",
 o:["Anfiteatro","Circo","Acueducto","Arco de triunfo"],
 r:"Acueducto",
 e:"Los acueductos permitían transportar agua."
},
{
 tipo:"OM",
 p:"¿Cuál de las siguientes era una importante aportación cultural romana?",
 o:[
 "El derecho romano",
 "La invención del papel",
 "La escritura jeroglífica",
 "La creación del alfabeto griego"
 ],
 r:"El derecho romano",
 e:"El latín y el derecho romano fueron aportaciones fundamentales."
},

// VERDADERO O FALSO
{
 tipo:"VF",
 p:"En la península itálica convivieron etruscos, itálicos y colonias griegas.",
 o:["Verdadero","Falso"],
 r:"Verdadero",
 e:"Diversos pueblos coexistieron en la península itálica."
},
{
 tipo:"VF",
 p:"Durante la Monarquía, Roma estaba gobernada únicamente por un emperador.",
 o:["Verdadero","Falso"],
 r:"Falso",
 e:"Durante la Monarquía había un rey, Senado y comicios."
},
{
 tipo:"VF",
 p:"Julio César fue el primer emperador romano.",
 o:["Verdadero","Falso"],
 r:"Falso",
 e:"El primer emperador fue Octavio Augusto."
},
{
 tipo:"VF",
 p:"Durante el Alto Imperio, Roma alcanzó su máxima expansión territorial.",
 o:["Verdadero","Falso"],
 r:"Verdadero",
 e:"La máxima expansión ocurrió durante el Alto Imperio."
},
{
 tipo:"VF",
 p:"Constantinopla fue la capital del Imperio romano de Occidente después de la división.",
 o:["Verdadero","Falso"],
 r:"Falso",
 e:"Constantinopla fue capital de la parte oriental."
},
{
 tipo:"VF",
 p:"Los patricios eran una minoría rica y poderosa de la sociedad romana.",
 o:["Verdadero","Falso"],
 r:"Verdadero",
 e:"Los patricios pertenecían a los grupos privilegiados."
},
{
 tipo:"VF",
 p:"Las domus eran edificios de varios pisos destinados principalmente a familias pobres.",
 o:["Verdadero","Falso"],
 r:"Falso",
 e:"Las domus eran viviendas de familias ricas; las ínsulas alojaban a familias pobres."
},
{
 tipo:"VF",
 p:"Los romanos utilizaron arcos, bóvedas y cúpulas en su arquitectura.",
 o:["Verdadero","Falso"],
 r:"Verdadero",
 e:"Estos elementos fueron característicos de la arquitectura romana."
},
{
 tipo:"VF",
 p:"La religión tradicional romana era monoteísta.",
 o:["Verdadero","Falso"],
 r:"Falso",
 e:"Los romanos eran politeístas: creían en varios dioses."
},
{
 tipo:"VF",
 p:"El emperador Teodosio convirtió el cristianismo en la religión oficial del Imperio.",
 o:["Verdadero","Falso"],
 r:"Verdadero",
 e:"Según el material, Teodosio estableció el cristianismo como religión oficial."
}
];

// Mezcla aleatoria Fisher-Yates.
function mezclar(arreglo) {
 const copia = [...arreglo];
 for(let i=copia.length-1;i>0;i--) {
   const j=Math.floor(Math.random()*(i+1));
   [copia[i],copia[j]]=[copia[j],copia[i]];
 }
 return copia;
}

let preguntas=[];
let entregado=false;

function preparar() {
 const om=mezclar(banco.filter(x=>x.tipo==="OM"));
 const vf=mezclar(banco.filter(x=>x.tipo==="VF"));

 // Mezclar los dos tipos entre sí.
 preguntas=mezclar([...om,...vf]).map(q=>({
   ...q,
   opciones:mezclar(q.o)
 }));
}

function dibujar() {
 const contenedor=document.getElementById("examen");
 contenedor.innerHTML="";

 preguntas.forEach((q,i)=>{
   const tarjeta=document.createElement("section");
   tarjeta.className="pregunta";
   tarjeta.id="pregunta"+i;

   const tipo=q.tipo==="OM"?"OPCIÓN MÚLTIPLE":"VERDADERO O FALSO";

   const etiqueta=document.createElement("div");
   etiqueta.className="tipo";
   etiqueta.textContent=tipo;

   const titulo=document.createElement("h3");
   titulo.textContent=(i+1)+". "+q.p;

   tarjeta.append(etiqueta,titulo);

   q.opciones.forEach((op,j)=>{
     const label=document.createElement("label");
     label.className="opcion";

     const radio=document.createElement("input");
     radio.type="radio";
     radio.name="q"+i;
     radio.value=op;
     radio.addEventListener("change",actualizarProgreso);

     const texto=document.createElement("span");
     const letra=q.tipo==="OM"
       ?String.fromCharCode(65+j)+") "
       :"";
     texto.textContent=letra+op;

     label.append(radio,texto);
     tarjeta.appendChild(label);
   });

   contenedor.appendChild(tarjeta);
 });
 actualizarProgreso();
}

function actualizarProgreso() {
 let respondidas=0;
 preguntas.forEach((q,i)=>{
   if(document.querySelector('input[name="q'+i+'"]:checked')){
     respondidas++;
   }
 });
 document.getElementById("progreso").textContent=
   "Respondidas: "+respondidas+" de "+preguntas.length;
 return respondidas;
}

function calificar() {
 if(entregado)return;

 const nombre=document.getElementById("nombre").value.trim();
 const grupo=document.getElementById("grupo").value.trim();
 const aviso=document.getElementById("aviso");

 if(!nombre || !grupo){
   aviso.textContent="Escribe tu nombre completo y grupo.";
   return;
 }

 const respondidas=actualizarProgreso();

 if(respondidas<preguntas.length){
   aviso.textContent=
     "Faltan "+(preguntas.length-respondidas)+" preguntas por responder.";
   return;
 }

 if(!confirm("¿Deseas entregar tu examen? Ya no podrás modificarlo.")){
   return;
 }

 entregado=true;
 aviso.textContent="";
 let aciertos=0;

 preguntas.forEach((q,i)=>{
   const tarjeta=document.getElementById("pregunta"+i);
   const seleccion=tarjeta.querySelector("input:checked");
   const respuesta=seleccion.value;

   if(respuesta===q.r)aciertos++;

   tarjeta.querySelectorAll(".opcion").forEach(label=>{
     const radio=label.querySelector("input");
     radio.disabled=true;

     if(radio.value===q.r){
       label.classList.add("correcta");
     }
     if(radio.checked && radio.value!==q.r){
       label.classList.add("incorrecta");
     }
   });

   const explicacion=document.createElement("div");
   explicacion.className="explicacion";
   explicacion.textContent=
     "Respuesta correcta: "+q.r+". "+q.e;
   tarjeta.appendChild(explicacion);
 });

 const calificacion=(aciertos/preguntas.length)*100;

 document.getElementById("alumnoResultado").textContent=
   nombre+" | Grupo: "+grupo;

 document.getElementById("nota").textContent=
   calificacion.toFixed(2)+" / 100";

 document.getElementById("aciertos").textContent=
   "Aciertos: "+aciertos+" de "+preguntas.length+
   " | Errores: "+(preguntas.length-aciertos);

 document.getElementById("mensaje").textContent=
   "Revisa las preguntas para identificar tus aciertos y errores.";

 document.getElementById("resultado").style.display="block";
 document.getElementById("entregar").disabled=true;
 document.getElementById("nombre").readOnly=true;
 document.getElementById("grupo").readOnly=true;

 document.getElementById("resultado").scrollIntoView({
   behavior:"smooth"
 });
}

function nuevoExamen(){
 if(!confirm("¿Quieres reiniciar el examen? Se perderán las respuestas.")){
   return;
 }
 entregado=false;
 document.getElementById("nombre").value="";
 document.getElementById("grupo").value="";
 document.getElementById("nombre").readOnly=false;
 document.getElementById("grupo").readOnly=false;
 document.getElementById("resultado").style.display="none";
 document.getElementById("entregar").disabled=false;
 document.getElementById("aviso").textContent="";
 preparar();
 dibujar();
 window.scrollTo({top:0,behavior:"smooth"});
}

preparar();
dibujar();
</script>
</body>
</html>
